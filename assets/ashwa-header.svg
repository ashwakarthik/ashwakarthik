<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ASHWA.EXE — AI / CYBERSECURITY / EMBEDDED SYSTEMS</title>
  <desc id="desc">A dark futuristic banner with crimson circuitry and seven interconnected nodes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="55%" stop-color="#11141c"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff244f"/>
      <stop offset="100%" stop-color="#ff654a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <path d="M0 300H240L280 260H420M1200 75H1030L990 115H900"
        fill="none" stroke="#ff244f" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M0 316H220L260 276M1200 58H1050L1010 98"
        fill="none" stroke="#ffffff" stroke-opacity=".10"/>

  <g fill="none" stroke="url(#red)" stroke-width="1.5" stroke-opacity=".7">
    <path d="M810 90H880L915 125H975"/>
    <path d="M810 145H860L895 180H975"/>
    <path d="M810 200H870L900 230H975"/>
    <path d="M810 255H855L885 285H975"/>
    <path d="M925 125V230"/>
    <path d="M1015 105H1080V155H1130"/>
    <path d="M1015 250H1070V205H1130"/>
  </g>

  <g fill="#ff3658" filter="url(#glow)">
    <circle cx="975" cy="125" r="3"/>
    <circle cx="975" cy="180" r="3"/>
    <circle cx="975" cy="230" r="3"/>
    <circle cx="975" cy="285" r="3"/>
    <circle cx="1130" cy="155" r="3"/>
    <circle cx="1130" cy="205" r="3"/>
  </g>

  <g font-family="monospace" font-size="10" fill="#ff6179" letter-spacing="2">
    <text x="64" y="48">SYSTEM PROFILE // 001</text>
    <text x="1135" y="330" text-anchor="end">BUILD • LEARN • SECURE</text>
  </g>

  <path d="M64 86H105" stroke="url(#red)" stroke-width="4"/>

  <text x="64" y="151" font-family="monospace" font-size="57"
        font-weight="bold" letter-spacing="-2" fill="#f5f7fb">KARTHIKASHWA<tspan fill="#ff3658">.EXE</tspan></text>

  <text x="67" y="190" font-family="monospace" font-size="15"
        fill="#c1c6d1" letter-spacing="2">AI / CYBERSECURITY / EMBEDDED SYSTEMS</text>

  <text x="67" y="226" font-family="monospace" font-size="13"
        fill="#8992a3">Cybersecurity / AI / Software / Embedded Systems</text>

  <g transform="translate(68 268)">
    <rect width="170" height="30" rx="5" fill="#ff3658" fill-opacity=".10"
          stroke="#ff3658" stroke-opacity=".65"/>
    <circle cx="15" cy="15" r="3.5" fill="#ff3658"/>
    <text x="28" y="19" font-family="monospace" font-size="11"
          fill="#f5f7fb" letter-spacing="1">POLYMATH IN PROGRESS</text>
  </g>

  <g transform="translate(1035 180)">
    <circle r="70" fill="none" stroke="#ff3658" stroke-opacity=".12"/>
    <circle r="54" fill="none" stroke="#ff3658" stroke-opacity=".28" stroke-dasharray="4 8"/>
    <circle r="38" fill="#ff3658" fill-opacity=".05" stroke="#ff3658" stroke-opacity=".7"/>
    <circle r="23" fill="none" stroke="#ff3658" stroke-opacity=".5"/>
    <path d="M-13 0H13M0-13V13" stroke="#ff3658" stroke-width="1.5"/>
    <circle r="5" fill="#ff3658" filter="url(#glow)"/>
  </g>

  <path d="M64 326H360" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="64" y="345" font-family="monospace" font-size="9"
        fill="#697283" letter-spacing="1.5">INTELLIGENCE. SECURITY. INNOVATION.</text>
</svg>
